# pnpm settings. Build scripts are blocked by default; these two need theirs
# (they download the esbuild and workerd binaries). Nothing else runs scripts.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@types/node@22.20.5'
  - miniflare@5.20261001.0-alpha
  - wrangler@4.147.0
